<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img"><rect width="100%" height="100%" fill="#f8f9f7"/><style>text{font-family:Arial,"Liberation Sans",sans-serif;}</style><text x="34.0" y="34.0" font-size="18" font-weight="600" fill="#18222c" text-anchor="start">Figure 2. Thickness information budget for different observation designs</text><text x="190.0" y="78.0" font-size="11" font-weight="400" fill="#66727d" text-anchor="start">Median theoretical 90% thickness interval / m</text><text x="175.0" y="105.0" font-size="12" font-weight="400" fill="#18222c" text-anchor="end">Fundamental</text><rect x="190" y="87" width="626.1" height="20" rx="4" fill="#187477" opacity="0.55"/><text x="824.1" y="103.0" font-size="11" font-weight="500" fill="#18222c" text-anchor="start">0.0466</text><text x="175.0" y="150.0" font-size="12" font-weight="400" fill="#18222c" text-anchor="end">Fund. + 1st higher</text><rect x="190" y="132" width="413.8" height="20" rx="4" fill="#187477" opacity="0.61"/><text x="611.8" y="148.0" font-size="11" font-weight="500" fill="#18222c" text-anchor="start">0.0308</text><text x="175.0" y="195.0" font-size="12" font-weight="400" fill="#18222c" text-anchor="end">Fund. + 1st + 2nd higher</text><rect x="190" y="177" width="345.5" height="20" rx="4" fill="#187477" opacity="0.67"/><text x="543.5" y="193.0" font-size="11" font-weight="500" fill="#18222c" text-anchor="start">0.0257</text><text x="175.0" y="240.0" font-size="12" font-weight="400" fill="#18222c" text-anchor="end">Fundamental + Q</text><rect x="190" y="222" width="611.0" height="20" rx="4" fill="#187477" opacity="0.73"/><text x="809.0" y="238.0" font-size="11" font-weight="500" fill="#18222c" text-anchor="start">0.0455</text><text x="175.0" y="285.0" font-size="12" font-weight="400" fill="#18222c" text-anchor="end">Fund. + 1st higher + Q</text><rect x="190" y="267" width="393.2" height="20" rx="4" fill="#187477" opacity="0.79"/><text x="591.2" y="283.0" font-size="11" font-weight="500" fill="#18222c" text-anchor="start">0.0293</text><text x="175.0" y="330.0" font-size="12" font-weight="400" fill="#18222c" text-anchor="end">Higher modes + group + Q</text><rect x="190" y="312" width="237.0" height="20" rx="4" fill="#187477" opacity="0.85"/><text x="435.0" y="328.0" font-size="11" font-weight="500" fill="#18222c" text-anchor="start">0.0176</text><text x="550.0" y="404.0" font-size="11" font-weight="400" fill="#66727d" text-anchor="middle">Fisher-information lower bound; the same forward model is used for generation and inversion, so this is optimistic.</text></svg>