<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img"><rect width="100%" height="100%" fill="#f8f9f7"/><style>text{font-family:Arial,"Liberation Sans",sans-serif;}</style><text x="255.0" y="78.0" font-size="18" font-weight="400" fill="#48545d" text-anchor="start">Median theoretical 90% thickness interval / m</text><text x="240.0" y="105.0" font-size="19" font-weight="400" fill="#18222c" text-anchor="end">Fundamental</text><rect x="255" y="87" width="569.6" height="20" rx="4" fill="#187477" opacity="0.55"/><text x="832.6" y="103.0" font-size="18" font-weight="500" fill="#18222c" text-anchor="start">0.0466</text><text x="240.0" y="150.0" font-size="19" font-weight="400" fill="#18222c" text-anchor="end">Fund. + 1st higher</text><rect x="255" y="132" width="376.4" height="20" rx="4" fill="#187477" opacity="0.61"/><text x="639.4" y="148.0" font-size="18" font-weight="500" fill="#18222c" text-anchor="start">0.0308</text><text x="240.0" y="195.0" font-size="19" font-weight="400" fill="#18222c" text-anchor="end">Fund. + 1st + 2nd higher</text><rect x="255" y="177" width="314.3" height="20" rx="4" fill="#187477" opacity="0.67"/><text x="577.3" y="193.0" font-size="18" font-weight="500" fill="#18222c" text-anchor="start">0.0257</text><text x="240.0" y="240.0" font-size="19" font-weight="400" fill="#18222c" text-anchor="end">Fundamental + Q</text><rect x="255" y="222" width="555.8" height="20" rx="4" fill="#187477" opacity="0.73"/><text x="818.8" y="238.0" font-size="18" font-weight="500" fill="#18222c" text-anchor="start">0.0455</text><text x="240.0" y="285.0" font-size="19" font-weight="400" fill="#18222c" text-anchor="end">Fund. + 1st higher + Q</text><rect x="255" y="267" width="357.7" height="20" rx="4" fill="#187477" opacity="0.79"/><text x="620.7" y="283.0" font-size="18" font-weight="500" fill="#18222c" text-anchor="start">0.0293</text><text x="240.0" y="330.0" font-size="19" font-weight="400" fill="#18222c" text-anchor="end">Higher modes + group + Q</text><rect x="255" y="312" width="215.6" height="20" rx="4" fill="#187477" opacity="0.85"/><text x="478.6" y="328.0" font-size="18" font-weight="500" fill="#18222c" text-anchor="start">0.0176</text><text x="550.0" y="404.0" font-size="18" font-weight="400" fill="#48545d" text-anchor="middle">Fisher-information lower bound; the same forward model is used for generation and inversion, so this is optimistic.</text></svg>